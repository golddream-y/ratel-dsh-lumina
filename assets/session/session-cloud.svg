    <path id="rim-inner" d="M90 37 C101 45 99 66 84 75 C73 82 59 78 53 67" stroke="url(#paint-rim)" stroke-width="2" opacity=".82" />
    <path id="core-light" d="M30 60 C43 44 51 73 72 72 C89 71 98 55 94 42 M31 65 C43 51 53 78 73 77 C89 76 103 61 99 45 M35 72 C48 64 55 87 77 83 M43 38 C55 28 68 40 78 36" stroke="url(#paint-inner)" stroke-width="1.2" opacity=".64" />
