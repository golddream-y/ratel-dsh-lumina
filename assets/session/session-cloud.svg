<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <filter id="cloud-material" x="-25%" y="-25%" width="150%" height="150%"><feTurbulence type="fractalNoise" baseFrequency=".035 .06" numOctaves="2" seed="8" result="grain" /><feDisplacementMap in="SourceGraphic" in2="grain" scale="3.5" xChannelSelector="R" yChannelSelector="G" /><feGaussianBlur stdDeviation="1.1" /></filter>
    <filter id="cloud-edge" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation=".7" /></filter>
    <filter id="cloud-halo" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="3" /></filter>
    <filter id="cloud-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" />
    </filter>
    <radialGradient id="paint-halo-cool" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(62 66) rotate(90) scale(52)">
      <stop stop-color="#67E8F9" stop-opacity=".8" />
      <stop offset=".52" stop-color="#38BDF8" stop-opacity=".32" />
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="paint-halo-warm" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(84 43) rotate(90) scale(38)">
      <stop stop-color="#FDA4AF" stop-opacity=".54" />
      <stop offset=".56" stop-color="#C084FC" stop-opacity=".18" />
      <stop offset="1" stop-color="#C084FC" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="paint-body" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(53 59) rotate(85) scale(54 49)">
      <stop stop-color="#102C82" stop-opacity=".9" />
      <stop offset=".35" stop-color="#2563EB" stop-opacity=".84" />
      <stop offset=".68" stop-color="#149FF5" stop-opacity=".78" />
      <stop offset=".9" stop-color="#67E8F9" stop-opacity=".65" />
      <stop offset="1" stop-color="#A5F3FC" stop-opacity=".28" />
    </radialGradient>
    <radialGradient id="paint-depth" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(38 70) rotate(126) scale(43 32)">
      <stop stop-color="#22D3EE" stop-opacity=".58" />
      <stop offset=".48" stop-color="#1D4ED8" stop-opacity=".46" />
      <stop offset="1" stop-color="#071A56" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="paint-warm" x1="60" y1="24" x2="101" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF1F7" stop-opacity=".92" />
      <stop offset=".26" stop-color="#FBCFE8" stop-opacity=".84" />
      <stop offset=".52" stop-color="#FB7185" stop-opacity=".78" />
      <stop offset=".76" stop-color="#A855F7" stop-opacity=".46" />
      <stop offset="1" stop-color="#67E8F9" stop-opacity=".18" />
    </linearGradient>
    <linearGradient id="paint-violet" x1="42" y1="88" x2="82" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0" />
      <stop offset=".46" stop-color="#C084FC" stop-opacity=".44" />
      <stop offset="1" stop-color="#F0ABFC" stop-opacity=".24" />
    </linearGradient>
    <linearGradient id="paint-inner" x1="48" y1="76" x2="84" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ECFEFF" stop-opacity=".78" />
      <stop offset=".48" stop-color="#67E8F9" stop-opacity=".38" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".08" />
    </linearGradient>
    <linearGradient id="paint-rim" x1="24" y1="60" x2="103" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5F3FC" stop-opacity="0" />
      <stop offset=".24" stop-color="#CFFAFE" stop-opacity=".94" />
      <stop offset=".7" stop-color="#F5D0FE" stop-opacity=".78" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g id="halo">
    <path id="halo-cool" d="M64 12 C92 12 116 36 116 64 C116 92 92 116 64 116 C36 116 12 92 12 64 C12 36 36 12 64 12 Z" fill="url(#paint-halo-cool)" />
    <path id="halo-warm" d="M84 18 C102 18 116 32 116 50 C116 68 102 82 84 82 C66 82 52 68 52 50 C52 32 66 18 84 18 Z" fill="url(#paint-halo-warm)" />
  </g>

  <g id="silhouette-group">
    <path id="silhouette" d="M64 21 C73 18 80 24 88 28 C101 31 109 42 106 55 C110 64 108 74 100 82 C92 91 83 91 76 98 C67 106 52 104 43 96 C34 90 25 88 23 75 C21 63 25 55 29 47 C34 36 45 31 54 27 C58 25 60 22 64 21 Z" fill="url(#paint-body)" />
