<path d="M 852 126 C 940 72 1040 64 1136 103 C 1183 121 1212 135 1252 143 C 1194 135 1173 126 1126 114 C 1028 87 949 93 852 126 Z" fill="url(#coral)" opacity=".78"/>
<path d="M 878 146 C 987 175 1104 166 1235 150 C 1123 177 999 187 878 146 Z" fill="url(#body)" opacity=".72"/>
