 <path d="M 204 234 C 323 280 390 292 483 249 C 568 209 579 169 665 157 C 732 147 769 163 828 146" stroke-width="1"/>
 <path d="M 282 268 C 399 282 462 256 536 209 C 596 170 620 152 679 148" stroke-width=".6"/>
 <path d="M 417 273 C 489 247 529 199 601 172 C 665 147 706 147 763 151" stroke-width="2.6" opacity=".7" filter="url(#soft)"/>
 <path d="M 573 197 C 654 161 701 146 770 155 C 828 161 872 136 926 122" stroke-width=".8"/>
 <path d="M 684 151 C 752 127 791 153 853 138 C 932 117 960 101 1036 113" stroke-width="1.2"/>
 <path d="M 67 156 C 204 194 245 253 362 275 C 471 295 525 255 610 211 C 777 125 845 77 968 99 C 1080 119 1160 142 1271 151" stroke-width="6" opacity=".48" filter="url(#glow)"/>
 <path d="M 67 156 C 204 194 245 253 362 275 C 471 295 525 255 610 211 C 777 125 845 77 968 99 C 1080 119 1160 142 1271 151" stroke-width="1.3"/>
</g>
