<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" fill="none">
<title>Lumina — folded light silk study</title>
<desc>Editable art study. Broad translucent folds, sharp light edges and local luminous caustics. Bundled appearance source for the WebGPU mesh renderer.</desc>
<defs>
 <linearGradient id="body" x1="130" y1="290" x2="1030" y2="105" gradientUnits="userSpaceOnUse"><stop stop-color="#8ed6ff" stop-opacity="0"/><stop offset=".16" stop-color="#3c89e9" stop-opacity=".08"/><stop offset=".37" stop-color="#94d0ff" stop-opacity=".62"/><stop offset=".49" stop-color="#f4fcff" stop-opacity=".85"/><stop offset=".61" stop-color="#5599ee" stop-opacity=".38"/><stop offset=".72" stop-color="#bbe9ff" stop-opacity=".44"/><stop offset=".84" stop-color="#f8fcff" stop-opacity=".78"/><stop offset="1" stop-color="#8acaff" stop-opacity="0"/></linearGradient>
 <linearGradient id="back" x1="250" y1="245" x2="1080" y2="95" gradientUnits="userSpaceOnUse"><stop stop-color="#448add" stop-opacity="0"/><stop offset=".24" stop-color="#75aee9" stop-opacity=".26"/><stop offset=".43" stop-color="#d6f1ff" stop-opacity=".14"/><stop offset=".57" stop-color="#3a78cd" stop-opacity=".4"/><stop offset=".68" stop-color="#94c9ff" stop-opacity=".08"/><stop offset=".83" stop-color="#d7f4ff" stop-opacity=".6"/><stop offset="1" stop-color="#83bded" stop-opacity="0"/></linearGradient>
 <linearGradient id="coral" x1="80" y1="170" x2="1150" y2="130" gradientUnits="userSpaceOnUse"><stop stop-color="#ff7f70" stop-opacity="0"/><stop offset=".12" stop-color="#ff9f91" stop-opacity=".24"/><stop offset=".26" stop-color="#ff675f" stop-opacity=".5"/><stop offset=".38" stop-color="#fff5df" stop-opacity=".85"/><stop offset=".48" stop-color="#ff8b7c" stop-opacity=".2"/><stop offset=".62" stop-color="#ffb2a3" stop-opacity=".1"/><stop offset=".78" stop-color="#ff8a82" stop-opacity=".38"/><stop offset=".88" stop-color="#fff9ee" stop-opacity=".8"/><stop offset="1" stop-color="#ffb8ad" stop-opacity="0"/></linearGradient>
 <linearGradient id="white" x1="120" y1="250" x2="1120" y2="120" gradientUnits="userSpaceOnUse"><stop stop-color="white" stop-opacity="0"/><stop offset=".18" stop-color="white" stop-opacity=".3"/><stop offset=".36" stop-color="white"/><stop offset=".51" stop-color="#f8fdff" stop-opacity=".8"/><stop offset=".68" stop-color="white" stop-opacity=".4"/><stop offset=".82" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
 <linearGradient id="rim" x1="140" y1="245" x2="1100" y2="115" gradientUnits="userSpaceOnUse"><stop stop-color="#9ed8ff" stop-opacity="0"/><stop offset=".3" stop-color="#3489df" stop-opacity=".3"/><stop offset=".45" stop-color="#f8ffff"/><stop offset=".58" stop-color="#5597dd" stop-opacity=".6"/><stop offset=".73" stop-color="#cae9ff" stop-opacity=".4"/><stop offset=".85" stop-color="white"/><stop offset="1" stop-color="#a6d2ff" stop-opacity="0"/></linearGradient>
 <radialGradient id="haze"><stop stop-color="#7abfff" stop-opacity=".25"/><stop offset=".4" stop-color="#bfdfff" stop-opacity=".12"/><stop offset="1" stop-color="#d4eaff" stop-opacity="0"/></radialGradient>
 <radialGradient id="warmHaze"><stop stop-color="#ff9c80" stop-opacity=".26"/><stop offset=".45" stop-color="#ffbe98" stop-opacity=".12"/><stop offset="1" stop-color="#ffdfc4" stop-opacity="0"/></radialGradient>
 <radialGradient id="flare"><stop stop-color="white"/><stop offset=".12" stop-color="#fffff5" stop-opacity=".78"/><stop offset=".3" stop-color="#fff9df" stop-opacity=".38"/><stop offset=".6" stop-color="#ffe2c1" stop-opacity=".10"/><stop offset="1" stop-color="#ffdcad" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-15%" y="-60%" width="130%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
 <filter id="soft" x="-15%" y="-60%" width="130%" height="220%"><feGaussianBlur stdDeviation="1.4"/></filter>
 <linearGradient id="foldShade" x1="427" y1="252" x2="694" y2="150" gradientUnits="userSpaceOnUse"><stop stop-color="#4687cf" stop-opacity="0"/><stop offset=".32" stop-color="#3277c2" stop-opacity=".12"/><stop offset=".52" stop-color="#90c8f6" stop-opacity=".42"/><stop offset=".66" stop-color="#2865ac" stop-opacity=".24"/><stop offset=".82" stop-color="#a5d8ff" stop-opacity=".14"/><stop offset="1" stop-color="#89c7f8" stop-opacity="0"/></linearGradient>
 <linearGradient id="foldLight" x1="359" y1="270" x2="927" y2="124" gradientUnits="userSpaceOnUse"><stop stop-color="white" stop-opacity="0"/><stop offset=".18" stop-color="#e5f8ff" stop-opacity=".28"/><stop offset=".38" stop-color="white" stop-opacity=".95"/><stop offset=".48" stop-color="white" stop-opacity=".10"/><stop offset=".6" stop-color="#effaff" stop-opacity=".8"/><stop offset=".76" stop-color="white" stop-opacity=".35"/><stop offset=".86" stop-color="white" stop-opacity=".9"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
 <radialGradient id="coldFlare"><stop stop-color="white" stop-opacity=".9"/><stop offset=".15" stop-color="#f1fdff" stop-opacity=".8"/><stop offset=".45" stop-color="#a8dbff" stop-opacity=".23"/><stop offset="1" stop-color="#a8dbff" stop-opacity="0"/></radialGradient>
 <path id="flow-spine" d="M 0 164 C 120 190 220 276 358 270 C 485 263 532 190 654 153 C 751 123 794 148 880 124 C 1009 88 1111 119 1234 144 C 1250 146 1265 148 1280 150"/>
 <path id="main" d="M -30 161 C 116 176 178 257 315 257 C 462 257 514 200 619 157 C 723 114 775 123 864 103 C 1014 68 1084 106 1310 151 C 1100 119 1007 118 887 147 C 791 171 752 145 662 182 C 538 233 469 304 320 283 C 174 263 110 186 -30 161 Z"/>
 <clipPath id="inside"><use href="#main"/></clipPath>
</defs>
<!-- Atmosphere is local to the folds; the canvas background remains transparent. -->
<ellipse cx="587" cy="205" rx="340" ry="100" fill="url(#haze)"/>
<ellipse cx="367" cy="261" rx="160" ry="72" fill="url(#warmHaze)"/>
<ellipse cx="932" cy="114" rx="155" ry="66" fill="url(#warmHaze)"/>
<!-- Reverse face and lifted back edge. -->
<path d="M -25 167 C 139 208 202 286 354 283 C 492 280 542 194 671 155 C 775 124 810 158 912 137 C 1061 106 1165 134 1310 151 C 1111 113 1033 75 885 108 C 781 131 747 109 645 145 C 521 188 470 267 337 267 C 190 267 125 187 -25 167 Z" fill="url(#back)"/>
