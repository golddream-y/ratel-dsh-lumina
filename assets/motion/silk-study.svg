<ellipse cx="383" cy="275" rx="56" ry="15" fill="url(#flare)"/>
<ellipse cx="638" cy="162" rx="40" ry="11" fill="url(#flare)" opacity=".85"/>
<ellipse cx="942" cy="110" rx="48" ry="13" fill="url(#flare)" opacity=".8"/>
<path d="M 305 275 C 343 279 370 278 426 271" stroke="url(#white)" stroke-width="1.2"/>
</svg>
