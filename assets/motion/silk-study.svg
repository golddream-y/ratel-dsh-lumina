 <path d="M 392 275 C 489 258 513 208 593 173 C 638 154 675 146 708 149 C 623 156 596 190 544 222 C 493 253 445 276 392 275 Z" fill="url(#white)"/>
 <path d="M 505 246 C 595 191 607 144 705 136 C 781 130 795 149 861 126 C 781 158 769 141 711 147 C 621 157 590 212 505 246 Z" fill="url(#body)"/>
 <path d="M 674 171 C 743 145 789 173 871 145 C 939 122 971 108 1037 115 C 961 98 929 112 869 127 C 786 149 751 133 674 171 Z" fill="url(#white)" opacity=".7"/>
</g>
<!-- Local reversals: a translucent cool underside directly beside a lifted lit face. -->
<g clip-path="url(#inside)">
 <path d="M 338 278 C 419 286 469 248 527 212 C 588 173 615 149 676 148 C 613 157 600 181 553 212 C 485 258 429 288 338 278 Z" fill="url(#foldShade)"/>
 <path d="M 437 267 C 496 243 526 203 581 178 C 607 165 633 154 666 151 C 632 160 609 176 588 191 C 537 227 506 251 437 267 Z" fill="url(#foldLight)"/>
 <path d="M 569 198 C 623 164 660 143 714 146 C 759 148 787 160 830 145 C 783 166 752 158 711 155 C 658 152 627 178 569 198 Z" fill="url(#foldShade)" opacity=".8"/>
 <path d="M 715 151 C 773 146 799 162 857 145 C 906 130 926 116 966 115 C 925 122 906 138 865 151 C 806 169 778 151 715 151 Z" fill="url(#foldLight)" opacity=".8"/>
 <path d="M 264 257 C 318 278 353 280 395 271 C 367 281 325 287 297 277 C 283 272 274 265 264 257 Z" fill="url(#foldLight)"/>
</g>
<!-- Short caustics vary in length and sharpness, following the fold instead of spanning the ribbon. -->
<g stroke="url(#foldLight)" stroke-linecap="round">
 <path d="M 394 273 C 463 257 487 224 543 194 C 581 174 607 160 643 154" stroke-width="4" opacity=".55" filter="url(#soft)"/>
 <path d="M 395 273 C 463 257 487 224 543 194 C 581 174 607 160 643 154" stroke-width=".9"/>
 <path d="M 448 259 C 488 246 512 218 549 197 C 584 178 614 162 650 157" stroke-width=".65" opacity=".78"/>
