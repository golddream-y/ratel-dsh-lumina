<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumina · 输入与新会话</title>
<style>
:root{--ink:#242b3b;--muted:#788294;--paper:#fff;--warm:#f46568;--cool:#557de8;--line:#e7eaf0;--glow-alpha:.9;--light-time:450ms;--hero-time:700ms;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;background:#f5f6f9}button,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #a7bdf5;outline-offset:3px}button:disabled{cursor:default;opacity:.4}
.shell{max-width:1100px;margin:auto;padding:32px 36px 24px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}.label{font-size:12px;letter-spacing:.12em;color:var(--muted)}h1{font-size:25px;letter-spacing:-.04em;margin:7px 0}.intro{font-size:13px;color:var(--muted);margin:0}.pill{font-size:12px;color:#5875b7;border:1px solid #d8e2f6;border-radius:30px;padding:5px 11px;white-space:nowrap}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:25px 0 16px}.btn{padding:9px 14px;border:1px solid #dfe3ec;border-radius:10px;background:var(--paper);color:var(--ink);font-size:13px}.btn.primary{background:#303c56;color:white;border-color:#303c56}.btn:hover{border-color:#90a7d7}.options{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:#647084}select{font:inherit;border:1px solid #dfe3ec;border-radius:7px;background:white;padding:6px;color:var(--ink)}label{display:flex;align-items:center;gap:5px}input[type=checkbox]{accent-color:var(--cool)}
.stage{position:relative;min-height:555px;border:1px solid var(--line);border-radius:22px;background:var(--paper);overflow:hidden;box-shadow:0 12px 40px #26375b06}.windowbar{height:44px;border-bottom:1px solid #f0f1f5;padding:0 24px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#8a93a3}.windowbar strong{color:#647186;font-weight:500}.dots{display:flex;gap:5px}.dots i{height:5px;width:5px;border-radius:50%;background:#d8dce6}.center{position:relative;margin:0 auto;min-height:316px;display:flex;flex-direction:column;align-items:center;justify-content:center;isolation:isolate}.halo{position:absolute;left:50%;top:50%;width:470px;height:230px;margin:-135px 0 0 -235px;border-radius:50%;background:radial-gradient(ellipse at 30% 50%,#f47f8d60,transparent 63%),radial-gradient(ellipse at 70% 50%,#85a5ff60,transparent 63%);mask-image:radial-gradient(ellipse,black 15%,transparent 72%);opacity:0;pointer-events:none;z-index:-1}.mark{width:62px;height:50px;color:var(--warm);display:grid;place-items:center;margin-bottom:22px}.mark svg{width:58px;height:50px}.welcome{font-size:25px;letter-spacing:-.05em;font-weight:500;margin:0 0 7px}.sub{font-size:13px;color:#929aab;margin:0}.response{font-size:16px;line-height:1.9;white-space:pre-wrap;max-width:680px;padding:0 20px;min-height:34px}.response:empty{display:none}.center.has-answer .welcome,.center.has-answer .sub{display:none}.center.has-answer .mark{width:36px;height:30px;margin-bottom:16px}.center.has-answer .mark svg{width:36px;height:30px}
.composer{position:relative;margin:0 54px 36px;border-radius:22px;padding:1.5px;background:linear-gradient(105deg,#f9aaaa,#dad9ee 45%,#afc7fc);isolation:isolate}.composer:after{content:"";position:absolute;inset:-12px;border-radius:inherit;z-index:-1;pointer-events:none;box-shadow:-12px 0 24px #f46c8029,12px 0 24px #5f91f333;opacity:0}.inside{border-radius:20.5px;background:white;padding:20px 23px 14px}.editor{min-height:76px;font-size:17px;line-height:1.8;outline:0;white-space:pre-wrap;overflow-wrap:anywhere;caret-color:var(--warm)}.editor:empty:before{content:attr(data-placeholder);color:#a6adbb;pointer-events:none}.bottom{display:flex;align-items:center;justify-content:space-between;color:#939baa;font-size:12px}.plus{font-size:23px;background:#f5f6f8;border:0;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;color:#586276}.send{border:0;border-radius:50%;background:#b9cbf5;color:white;width:34px;height:34px;display:grid;place-items:center;font-size:23px}.composer:focus-within:after{opacity:.45;transition:opacity .2s}
.stage.entering .mark{animation:mark-in 360ms cubic-bezier(.22,1,.36,1) both}.stage.entering .halo{animation:halo-in 600ms 60ms ease-out both}.stage.entering .composer:after{animation:rim-in 520ms 180ms ease-out both}
@keyframes mark-in{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:none}}@keyframes halo-in{0%{opacity:0;transform:scale(.75)}35%{opacity:var(--glow-alpha)}100%{opacity:0;transform:scale(1.14)}}@keyframes rim-in{0%{opacity:0}32%{opacity:var(--glow-alpha)}100%{opacity:0}}
.glyph-light{position:fixed;z-index:20;pointer-events:none;user-select:none;white-space:pre;color:var(--warm);opacity:0;text-shadow:0 0 3px currentColor,0 0 11px currentColor;animation:glyph-on var(--light-time) ease-out both}.glyph-light.cool{color:var(--cool)}
@keyframes glyph-on{0%{opacity:0}16%{opacity:var(--glow-alpha)}42%{opacity:calc(var(--glow-alpha) * .8)}100%{opacity:0}}
body[data-strength=soft]{--glow-alpha:.48}body[data-strength=soft] .glyph-light{text-shadow:0 0 2px currentColor,0 0 6px currentColor}.timeline{display:flex;justify-content:center;gap:28px;margin:21px 0 0;font-size:12px;color:#7b8597}.timeline b{font-variant-numeric:tabular-nums;font-weight:500;color:#586780;margin-right:5px}.foot{font-size:11px;color:#929aaa;margin:18px 0 0;text-align:center}body[data-reduced=true] .glyph-light{display:none}body[data-reduced=true] .stage *{animation:none!important}body[data-reduced=true] .halo,body[data-reduced=true] .composer:after{opacity:0!important}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.glyph-light,.halo{display:none!important}.composer:after{opacity:0!important}}
@media(max-width:700px){.shell{padding:22px 16px}.top{align-items:start}.pill{display:none}.options{margin-left:0;width:100%;margin-top:8px}.stage{min-height:510px}.center{min-height:285px}.composer{margin:0 20px 25px}.inside{padding:15px}.welcome{font-size:22px}.timeline{gap:12px;font-size:10px}.halo{width:330px;margin-left:-165px}}
</style></head>
<body data-strength="clear" data-reduced="false">
<main class="shell">
<header class="top"><div><div class="label">LUMINA · MOTION STUDY 01</div><h1>输入有回应，新会话有开场</h1><p class="intro">新字点亮 × 柔光入场。正文保持清晰，光出现一次，然后安静下来。</p></div><span class="pill">A＋C · 设计预览</span></header>
<nav class="controls" aria-label="预览操作"><button class="btn primary" id="new">新建会话 · 重播</button><button class="btn" id="type">播放输入示例</button><button class="btn" id="reply">播放回复示例</button><div class="options"><label>强度<select id="strength"><option value="clear">清晰</option><option value="soft">轻柔</option></select></label><label><input id="reduce" type="checkbox">减少动态</label></div></nav>

<div class="composer"><div class="inside"><div class="editor" id="editor" role="textbox" aria-label="输入文字体验逐字点亮" aria-multiline="true" contenteditable="true" data-placeholder="在这里打字，感受新字亮起的瞬间…"></div><div class="bottom"><button class="plus" aria-label="装饰性添加按钮" disabled>＋</button><span>DeepSeek Harness</span><button class="send" aria-label="播放回复预览" id="send">↑</button></div></div></div>
</section>
<div class="timeline" aria-label="建议入场时序"><span><b>0–360ms</b>标识轻抬</span><span><b>60–660ms</b>柔光展开</span><span><b>180–700ms</b>边缘响应</span></div>
<p class="foot" id="foot">独立设计原型 · 不会发送消息 · 非真实客户端验收</p>
</main>
<script>
const $=s=>document.querySelector(s), editor=$('#editor'),response=$('#response'),stage=$('#stage');
const media=matchMedia('(prefers-reduced-motion: reduce)'),lights=new Set(),timers=new Set();
const segments=new Intl.Segmenter('zh',{granularity:'grapheme'});
let previous='',composing=false,generation=0;
const reduced=()=>media.matches||$('#reduce').checked;
function later(fn,ms){const id=setTimeout(()=>{timers.delete(id);fn()},ms);timers.add(id);return id}
function clearLights(){for(const light of lights)light.remove();lights.clear()}
function cancel(){generation++;for(const id of timers)clearTimeout(id);timers.clear();clearLights();$('#type').disabled=false;$('#reply').disabled=false;stage.classList.remove('entering')}
function light(element,from,to,cool=false){
 if(reduced())return;
 const all=element.textContent||'',batch=[...segments.segment(all)].filter(g=>g.index>=from&&g.index<to).slice(-8);
 const walker=document.createTreeWalker(element,NodeFilter.SHOW_TEXT);let node,offset=0,parts=[];
 while(node=walker.nextNode()){parts.push({node,start:offset,end:offset+node.length});offset+=node.length}
 batch.forEach((g,i)=>{
  const start=parts.find(p=>g.index>=p.start&&g.index<p.end),end=parts.find(p=>g.index+g.segment.length>p.start&&g.index+g.segment.length<=p.end);if(!start||!end)return;
  const range=document.createRange();range.setStart(start.node,g.index-start.start);range.setEnd(end.node,g.index+g.segment.length-end.start);
  const box=range.getBoundingClientRect();if(!box.width||!box.height)return;
  const glyph=document.createElement('span');glyph.className='glyph-light'+(cool?' cool':'');glyph.textContent=g.segment;glyph.setAttribute('aria-hidden','true');
  const style=getComputedStyle(start.node.parentElement);
  Object.assign(glyph.style,{left:box.left+'px',top:box.top+'px',width:box.width+'px',height:box.height+'px',font:style.font,lineHeight:box.height+'px',animationDelay:i*35+'ms'});
  document.body.append(glyph);lights.add(glyph);
  while(lights.size>24){const first=lights.values().next().value;first.remove();lights.delete(first)}
  later(()=>{glyph.remove();lights.delete(glyph)},450+i*35+30);
 });
}
function inputChanged(){
 const next=editor.textContent||'';let prefix=0;while(prefix<previous.length&&prefix<next.length&&previous[prefix]===next[prefix])prefix++;
 let suffix=0;while(suffix<previous.length-prefix&&suffix<next.length-prefix&&previous[previous.length-1-suffix]===next[next.length-1-suffix])suffix++;
 if(next.length-suffix>prefix)light(editor,prefix,next.length-suffix);previous=next;
}
editor.addEventListener('compositionstart',()=>{composing=true});editor.addEventListener('compositionend',()=>{composing=false;inputChanged()});
editor.addEventListener('input',e=>{if(!composing&&!e.isComposing)inputChanged()});
editor.addEventListener('beforeinput',()=>{if($('#type').disabled){cancel();previous=editor.textContent||''}});
function newSession(){cancel();editor.textContent='';previous='';response.textContent='';$('#center').classList.remove('has-answer');
 if(!reduced()){void stage.offsetWidth;stage.classList.add('entering');later(()=>stage.classList.remove('entering'),740)}
}
function playInput(){cancel();editor.textContent='';previous='';$('#type').disabled=true;const id=generation;const chars=[...segments.segment('让每一次输入，都有清楚而轻盈的回应。')].map(g=>g.segment);
 function step(i){if(id!==generation)return;if(i>=chars.length){$('#type').disabled=false;return}editor.append(document.createTextNode(chars[i]));inputChanged();later(()=>step(i+1),115)}step(0);
}
function playReply(){cancel();$('#reply').disabled=true;$('#center').classList.add('has-answer');response.textContent='';const id=generation;const chars=[...segments.segment('光跟着新出现的文字前行，随后轻轻退去。\n内容始终清楚，对话自然继续。')].map(g=>g.segment);
 function step(i){if(id!==generation)return;if(i>=chars.length){$('#reply').disabled=false;return}const from=response.textContent.length;response.append(document.createTextNode(chars[i]));light(response,from,response.textContent.length,true);later(()=>step(i+1),75)}step(0);
}
function motionChanged(){cancel();document.body.dataset.reduced=String(reduced());$('#foot').textContent=reduced()?'减少动态已开启 · 只展示内容，不播放光效与入场':'独立设计原型 · 不会发送消息 · 非真实客户端验收'}
$('#new').onclick=newSession;$('#type').onclick=playInput;$('#reply').onclick=playReply;$('#send').onclick=playReply;
$('#strength').onchange=e=>{document.body.dataset.strength=e.target.value;clearLights()};$('#reduce').onchange=motionChanged;media.addEventListener('change',motionChanged);
addEventListener('scroll',clearLights,true);addEventListener('resize',clearLights);addEventListener('pagehide',cancel);
motionChanged();requestAnimationFrame(()=>requestAnimationFrame(newSession));
</script></body></html>
