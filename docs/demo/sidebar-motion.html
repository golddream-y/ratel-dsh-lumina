<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumina 面板动效</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#303744;background:#f8fafc}button{font:inherit;color:inherit;border:0;cursor:pointer;background:transparent;padding:10px;border-radius:10px}button:hover{background:#e9edf4}.shell{display:grid;grid-template-columns:290px 1fr;min-height:100vh;transition:grid-template-columns .26s cubic-bezier(.2,.7,.3,1)}.shell.closed{grid-template-columns:0 1fr}aside{overflow:hidden;background:#f0f3f8;border-right:1px solid #e1e5ed}aside>div{width:290px;padding:22px 14px;transition:opacity .18s,transform .26s}.closed aside>div{opacity:0;transform:translateX(-24px)}h2{font-size:19px;margin:4px 10px 28px}.group{width:100%;text-align:left;display:flex;gap:10px;align-items:center}.arrow{display:inline-block;transition:transform .24s}.group[aria-expanded=true] .arrow{transform:rotate(90deg)}.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .24s ease}.fold.shut{grid-template-rows:0fr}.fold>div{overflow:hidden}.row{position:relative;isolation:isolate;width:100%;height:47px;display:flex;align-items:center;text-align:left;margin:4px 0;overflow:hidden;transition:background .22s}.row.selected{background:#e0e7f3}.row .label{position:relative;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{position:relative;z-index:2;width:7px;height:7px;flex:none;border-radius:50%;background:#a5adbb;margin:0 12px 0 3px}.running .dot{background:#6489cf}.wind{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;transition:opacity .6s;z-index:0}.running .wind{opacity:.72}.ribbon{transform-origin:center;animation:float 7.7s ease-in-out infinite alternate}.ribbon.second{animation-duration:9.3s;animation-delay:-3s}.thread{stroke-dasharray:52 190;animation:flow 3.6s linear infinite;fill:none;stroke-width:1.2}.second .thread{animation-duration:4.7s;animation-delay:-2s}@keyframes float{from{transform:translateY(-3px) scaleY(.8)}to{transform:translateY(3px) scaleY(1.15)}}@keyframes flow{to{stroke-dashoffset:-242}}main{padding:26px 40px;min-width:0}header{display:flex;gap:12px;align-items:center}article{max-width:700px;margin:100px auto;color:#657086;line-height:1.8}h1{color:#303744;font-weight:550}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px}.controls button{background:#e6ecf6}dialog{border:1px solid #e1e6ef;border-radius:20px;padding:28px;box-shadow:0 24px 90px #24395a22;max-width:420px}dialog[open]{animation:enter .22s ease-out}dialog::backdrop{background:#17233b33;animation:fade .22s}dialog.leaving{animation:leave .16s ease-in forwards}dialog.leaving::backdrop{animation:fade .16s reverse forwards}@keyframes enter{from{opacity:0;transform:translateY(6px) scale(.98)}}@keyframes leave{to{opacity:0;transform:translateY(4px) scale(.98)}}@keyframes fade{from{opacity:0}to{opacity:1}}.no-dot .dot{visibility:hidden}body.dark{filter:invert(.88) hue-rotate(180deg);background:#121722}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.wind{overflow:hidden}.ribbon{opacity:.38}.thread{stroke-width:.55;stroke-dasharray:90 260;opacity:.65}.silk{fill:none;stroke-linecap:round;stroke-width:.65;mix-blend-mode:multiply}.selected .wind{opacity:.9}.row{height:49px;border-radius:11px}.row.selected{background:#e4ebf6;box-shadow:inset 0 0 0 1px #b8cbe52b}.dot{width:5px;height:5px}.running .dot{box-shadow:0 0 6px #81a6e766}aside{background:linear-gradient(140deg,#f3f5fa,#edf1f7)}

/* Group reveal: bounded stagger and a small downward settling motion. */
.fold{transition:grid-template-rows .28s cubic-bezier(.22,.75,.25,1)}
.fold .row{transition:background .22s,opacity .26s cubic-bezier(.22,.75,.25,1),transform .26s cubic-bezier(.22,.75,.25,1);opacity:1;transform:translateY(0)}
.fold:not(.shut) .row:nth-child(2){transition-delay:0s,12ms,12ms}
.fold:not(.shut) .row:nth-child(3){transition-delay:0s,24ms,24ms}
.fold:not(.shut) .row:nth-child(n+4){transition-delay:0s,36ms,36ms}
.fold.shut .row{opacity:0;transform:translateY(-6px);transition-duration:.22s,.24s,.24s}
@media(prefers-reduced-motion:reduce){.fold,.fold .row{transition:none;transform:none}}
</style><div class="shell" id="shell"><aside><div><h2>◈ Lumina · 流光</h2><button class="group" aria-expanded="true"><span class="arrow">›</span>工作区 · 产品设计</button><div class="fold"><div id="rows"></div></div></div></aside><main><header><button id="toggle">☰ 侧栏</button><span>面板与 session 动效 · 交互原型</span></header><article><h1>让星河，随风流动</h1><p>蓝白光芯在薄雾中舒展，星点沿河流前行。点击左侧切换会话，或切换运行状态，比较星河流光与静止底板。</p><div class="controls"><button id="run">切换当前运行状态</button><button id="dots">显示 / 隐藏状态点</button><button id="modal">打开弹框</button><button id="theme">深浅色对照</button></div><p>这是视觉原型，尚未接入 DSH。分组箭头、内容展开与下方条目同步；快速反向点击会接续当前动画。</p></article></main></div><dialog id="dialog"><h2>面板动效</h2><p>遮罩淡入，面板轻微归位。关闭时快速淡出。</p><button id="close">关闭</button></dialog><script>
const names=['客户端动效设计','整理下一版需求','优化输入体验','插件发布与收录','项目文档'];let selected=0;const rows=document.querySelector('#rows');names.forEach((name,i)=>{const b=document.createElement('button');b.className='row'+(i===0?' selected':'')+([0,2].includes(i)?' running':'');b.setAttribute('aria-pressed',i===0);b.innerHTML=`<svg class="wind" viewBox="0 0 280 47" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="g${i}"><stop stop-color="#8bbaff" stop-opacity="0"/><stop offset=".35" stop-color="#8bbaff" stop-opacity=".35"/><stop offset=".6" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#ffb7bd" stop-opacity=".25"/></linearGradient></defs><g class="ribbon"><path d="M-30 23 Q40 51 110 30 T300 28 L300 39 Q210 18 110 38 T-30 32Z" fill="url(#g${i})"/><path class="thread" d="M-30 25 Q40 52 110 32 T310 30" stroke="#9ebfff"/></g><g class="ribbon second"><path d="M-30 38 Q65 8 145 34 T310 20 L310 28 Q220 54 145 40 T-30 43Z" fill="url(#g${i})"/><path class="thread" d="M-30 39 Q65 9 145 35 T310 21" stroke="#efadb5"/></g></svg><span class="dot"></span><span class="label">${name}</span>`;b.onclick=()=>{selected=i;document.querySelectorAll('.row').forEach((r,j)=>{r.classList.toggle('selected',j===i);r.setAttribute('aria-pressed',j===i)})};rows.append(b)});document.querySelector('#toggle').onclick=()=>document.querySelector('#shell').classList.toggle('closed');document.querySelector('.group').onclick=e=>{const b=e.currentTarget;const open=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',open);document.querySelector('.fold').classList.toggle('shut',!open)};document.querySelector('#run').onclick=()=>rows.children[selected].classList.toggle('running');document.querySelector('#dots').onclick=()=>rows.classList.toggle('no-dot');document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');const d=document.querySelector('dialog');document.querySelector('#modal').onclick=()=>{d.classList.remove('leaving');d.showModal()};function close(){if(d.classList.contains('leaving'))return;d.classList.add('leaving');setTimeout(()=>d.close(),matchMedia('(prefers-reduced-motion:reduce)').matches?0:160)}document.querySelector('#close').onclick=close;d.addEventListener('cancel',e=>{e.preventDefault();close()});document.addEventListener('visibilitychange',()=>document.querySelectorAll('.ribbon,.thread').forEach(n=>n.style.animationPlayState=document.hidden?'paused':'running'));
</script>

<style>
.wind{display:none}.galaxy{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .65s}.running .galaxy{opacity:1}.row{height:52px;margin:5px 0}.row.running{background:linear-gradient(115deg,#e0eaffaa,#e8e9f599 65%,#f6e5ee88)}.row.selected{box-shadow:inset 0 0 0 1px #8babdf66;background:#dce7fa}.row .label{font-weight:450;text-shadow:0 1px 4px #ffffffd9}.row.selected .label{font-weight:550}.running .dot{background:#83a8e0;box-shadow:0 0 8px #75aaff88}body.dark{filter:none;background:#141923;color:#d5deee}body.dark aside{background:linear-gradient(150deg,#1b2332,#151d29);border-color:#2c3749}body.dark .row.running{background:linear-gradient(115deg,#24334b,#2d2c42 65%,#32293c)}body.dark .row.selected{background:#293b58;box-shadow:inset 0 0 0 1px #6489bd66}body.dark .label{text-shadow:0 1px 4px #111b2d}body.dark h1{color:#e6edfa}body.dark article{color:#9fadc4}body.dark button:hover,body.dark .controls button{background:#263247}body.dark dialog{background:#202a3a;color:#d5deee;border-color:#39465b}.version{display:inline-block;font-size:11px;letter-spacing:.15em;color:#8a9bb5;margin:0 0 4px}.controls button{transition:background .15s,transform .15s}.controls button:active{transform:scale(.97)}
</style>
<script>
(async()=>{
const {createGalaxyPainter}=await import('/__lumina/session-galaxy-painter.js');
const reduced=matchMedia('(prefers-reduced-motion:reduce)');let frame=0;
const scenes=[...document.querySelectorAll('.row')].map((row,i)=>{const canvas=document.createElement('canvas');canvas.className='galaxy';canvas.setAttribute('aria-hidden','true');row.prepend(canvas);return {row,canvas,g:canvas.getContext('2d'),paint:createGalaxyPainter(i)}});
function draw(now){if(!document.hidden&&!document.querySelector('#shell').classList.contains('closed')&&!document.querySelector('.fold').classList.contains('shut'))for(const s of scenes){if(!s.row.classList.contains('running'))continue;const w=s.row.clientWidth,h=s.row.clientHeight,dpr=Math.min(devicePixelRatio,1.25);if(s.canvas.width!==Math.round(w*dpr)||s.canvas.height!==Math.round(h*dpr)){s.canvas.width=Math.round(w*dpr);s.canvas.height=Math.round(h*dpr)}s.g.setTransform(dpr,0,0,dpr,0,0);s.g.clearRect(0,0,w,h);s.paint(s.g,w,h,reduced.matches?0:now/1000,document.body.classList.contains('dark'))}if(!reduced.matches)frame=requestAnimationFrame(draw)}draw(performance.now());reduced.addEventListener('change',()=>{cancelAnimationFrame(frame);draw(performance.now())});document.addEventListener('click',()=>{if(reduced.matches)draw(performance.now())});window.addEventListener('pagehide',()=>cancelAnimationFrame(frame));
})();
</script></html>
