<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工具执行 · Lumina 动效设计</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#242932;background:#f6f7f9;font-synthesis:none;--muted:#8a909a;--line:#e9ecf0;--blue:#70b9ff;--coral:#ff9b9c;--ease:cubic-bezier(.22,.75,.25,1)}
*{box-sizing:border-box}body{margin:0;padding:54px 28px 70px}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #4c7ef0;outline-offset:4px}main{max-width:980px;margin:auto}.eyebrow{font-size:12px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}h1{font-size:30px;letter-spacing:-1px;margin:12px 0;font-weight:650}.intro{font-size:14px;color:#6c7480;line-height:1.8;margin:0 0 28px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolbar button{background:#fff;border:1px solid #e1e5ea;border-radius:9px;padding:8px 13px;color:#4b5564;font-size:13px}.toolbar button:first-child{background:#273c63;color:white;border-color:#273c63}.toolbar .gap{width:8px}.stage{background:#fff;min-height:510px;border:1px solid #e8ebef;border-radius:18px;margin-top:22px;padding:42px 48px;box-shadow:0 12px 50px #243e6905}.question{margin-left:auto;width:max-content;max-width:80%;font-size:14px;background:#edf2fc;border-radius:14px 14px 4px 14px;padding:12px 17px;color:#3e506f}.answer{font-size:14px;line-height:1.9;margin:28px 0 18px;color:#576170}.tool{position:relative;margin:9px 0}.tool.new{animation:enter 180ms var(--ease)}@keyframes enter{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}.head{display:flex;width:100%;align-items:center;text-align:left;gap:10px;border:0;background:transparent;padding:10px 0;color:inherit;position:relative;border-radius:6px}.head:hover{background:#f8f9fb}.icon{width:16px;height:16px;flex:none;stroke:#747f90;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.title{font-size:14px;white-space:nowrap;font-weight:500}.sep{height:12px;width:1px;background:#dce0e7}.summary{font-size:13px;color:#7d8695;min-width:0;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}.chevron{width:13px;height:13px;stroke:#939baa;fill:none;stroke-width:1.4;transition:transform 160ms var(--ease);margin-left:auto;flex:none}.head[aria-expanded=true] .chevron{transform:rotate(180deg)}.status{font-size:11px;color:#9099a5;white-space:nowrap;margin-left:auto;padding-left:10px}.status+.chevron{margin-left:0}.tool[data-state=error] .status{color:#c85b68}.tool[data-state=stopped] .status{color:#7d8695}.flow{position:absolute;pointer-events:none;width:28px;height:28px;left:-6px;top:calc(50% - 14px);opacity:0;transform-origin:center;transition:opacity 220ms}.flow .stream-a,.flow .stream-b{position:absolute;inset:0;border-radius:50%;pointer-events:none}.flow .stream-a{background:radial-gradient(ellipse at 32% 44%,#5ca4ef66,#70b9ff2e 35%,transparent 72%)}.flow .stream-b{background:radial-gradient(ellipse at 66% 56%,#ff8d9252,#ffb3ab33 35%,transparent 72%)}.tool[data-state=preparing] .flow{opacity:.3}.tool[data-state=running] .flow{opacity:.9}.tool[data-state=running] .stream-a{animation:drift-a 2.8s ease-in-out infinite}.tool[data-state=running] .stream-b{animation:drift-b 2.8s ease-in-out infinite}.tool[data-state=error] .flow,.tool[data-state=stopped] .flow{transition-duration:120ms}.tool[data-state=ok].settling .flow{animation:settle 260ms var(--ease) forwards}@keyframes drift-a{0%,100%{transform:translate(-.6px,.3px) scale(.92);opacity:.6}50%{transform:translate(.6px,-.3px) scale(1.08);opacity:1}}@keyframes drift-b{0%,100%{transform:translate(.5px,-.3px) scale(1.06);opacity:1}50%{transform:translate(-.5px,.3px) scale(.9);opacity:.55}}@keyframes settle{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(.65)}}.disclosure{display:grid;grid-template-rows:0fr;transition:grid-template-rows 190ms var(--ease)}.tool.open .disclosure{grid-template-rows:1fr}.clip{overflow:hidden;min-height:0}.body{margin:8px 0 5px 24px;border:1px solid #e9edf2;border-radius:10px;background:#fafbfd;padding:14px 18px;opacity:0;transform:translateY(-3px);transition:opacity 160ms,transform 180ms var(--ease)}.tool.open .body{opacity:1;transform:none}.code{font:12px/1.85 ui-monospace,SFMono-Regular,Menlo,monospace;color:#69778a;white-space:pre-wrap;margin:0}.code strong{color:#3c556e;font-weight:500}.meta{display:flex;gap:8px;align-items:center;font-size:11px;color:#929ba8;padding:0 0 10px;margin-bottom:10px;border-bottom:1px solid #edf0f5}.dot{width:5px;height:5px;border-radius:50%;background:#93a2b9}.outcome{font-size:13px;color:#5a687d;min-height:22px;line-height:1.9;margin:24px 0 0}.footer{margin-top:18px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;font-size:12px;color:#939aa5;line-height:1.8}.note{margin-top:20px;font-size:12px;color:#9098a4;line-height:1.9;max-width:780px}.note strong{font-weight:500;color:#737f90}
@media(max-width:650px){body{padding:24px 15px}.stage{padding:24px 20px}.summary{max-width:170px}.status{display:none}h1{font-size:26px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;transform:none!important}.flow{display:none}}
</style>
<main>
<div class="eyebrow">Ratel Lumina · Motion Study</div>
<h1>每一次执行，都有回应。</h1>
<p class="intro">轻轻出现，持续流动，完成后安静收束。日志和结果始终是主角。</p>
<div class="toolbar" aria-label="原型播放控制"><button id="replay">重播完整过程</button><span class="gap"></span><button data-action="running">保持执行中</button><button data-action="ok">完成</button><button data-action="error">失败</button><button data-action="stopped">停止</button></div>
<section class="stage" aria-label="工具执行场景示意">
<div class="question">帮我检查项目并运行测试</div><p class="answer">我先查看项目配置，再运行测试。</p>
<div class="tool" id="read" data-state="ok"><button class="head" aria-expanded="false" aria-controls="read-body"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.5h6l4 4v11H5zM11 2.5v4h4M8 10h4M8 13h4"/></svg><span class="title">读取文件</span><span class="sep"></span><span class="summary">package.json</span><span class="status">已完成</span><svg class="chevron" viewBox="0 0 14 14" aria-hidden="true"><path d="m3 5 4 4 4-4"/></svg></button><div class="disclosure" id="read-body" inert><div class="clip"><div class="body"><pre class="code">{
  "name": "project",
  "scripts": { "test": "vitest run" }
}</pre></div></div></div></div>
<div class="tool" id="command" data-state="preparing"><button class="head" aria-expanded="false" aria-controls="command-body"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m4 6 4 4-4 4M10 14h6"/></svg><span class="title">执行命令</span><span class="sep"></span><span class="summary">npm test</span><span class="status">准备中</span><svg class="chevron" viewBox="0 0 14 14" aria-hidden="true"><path d="m3 5 4 4 4-4"/></svg><span class="flow" aria-hidden="true"><span class="stream-a"></span><span class="stream-b"></span></span></button>

<div class="disclosure" id="command-body" inert><div class="clip"><div class="body"><div class="meta"><span class="dot"></span><span>终端输出 · 示例数据</span></div><pre class="code" id="output">$ npm test</pre></div></div></div></div>
<p class="outcome" id="outcome"></p>
</section>
<div class="footer"><span id="phase" role="status" aria-live="polite">准备参数</span><span>点击工具标题，试试展开与收起</span></div>
<p class="note"><strong>设计原型，尚未接入客户端。</strong>正文收起在这里展示完整节奏；实际接入时以原生卸载与滚动行为为准。标题、状态文字和工具输出均为示例，不代表插件会新增这些提示。</p>
</main>
<script>
const command=document.querySelector('#command'), read=document.querySelector('#read'), output=document.querySelector('#output'), phase=document.querySelector('#phase'), outcome=document.querySelector('#outcome');let timers=[];
const later=(fn,time)=>timers.push(setTimeout(fn,time));const clear=()=>{timers.forEach(clearTimeout);timers=[]};
const labels={preparing:'准备参数',running:'执行中 · 图标柔光交融',ok:'执行完成 · 柔光原位收束',error:'执行失败 · 原生提示立即显现',stopped:'执行停止 · 装饰撤去'};
function setOpen(tool,open){tool.classList.toggle('open',open);tool.querySelector('.head').setAttribute('aria-expanded',String(open));tool.querySelector('.disclosure').inert=!open}
document.querySelectorAll('.head').forEach(button=>button.onclick=()=>setOpen(button.closest('.tool'),button.getAttribute('aria-expanded')!=='true'));
function state(next){const previous=command.dataset.state;command.dataset.state=next;command.classList.toggle('settling',next==='ok'&&previous==='running');command.querySelector('.status').textContent={preparing:'准备中',running:'执行中',ok:'已完成',error:'执行失败',stopped:'已停止'}[next];phase.textContent=labels[next];outcome.textContent=next==='ok'?'测试通过，结果已就绪。':next==='error'?'命令返回错误，展开查看输出。':next==='stopped'?'执行已停止。':'';if(next==='ok')output.textContent='$ npm test\n\n ✓ config.spec.ts\n ✓ session.spec.ts\n\n Test Files  2 passed';if(next==='error')output.textContent='$ npm test\n\n Configuration error\n 请检查测试配置。';}
function play(){clear();setOpen(command,false);setOpen(read,false);output.textContent='$ npm test';command.classList.remove('new');void command.offsetWidth;command.classList.add('new');state('preparing');later(()=>state('running'),600);later(()=>output.textContent='$ npm test\n\n RUN  project\n ✓ config.spec.ts',1800);later(()=>output.textContent+='\n ✓ session.spec.ts',2900);later(()=>state('ok'),4600)}
document.querySelector('#replay').onclick=play;document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>{clear();if(button.dataset.action==='running')output.textContent='$ npm test\n\n RUN  project';state(button.dataset.action)});
window.addEventListener('pagehide',clear);if(matchMedia('(prefers-reduced-motion: reduce)').matches)state('ok');else play();
</script>
</html>
