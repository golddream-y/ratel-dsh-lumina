</style><body><h1>发送反馈 · 两圈水纹</h1><small>实际插件构建 / 受控页面，非真实客户端录屏</small><div id="chat" data-conversation-content data-conversation-region="chat" data-conversation-session="one"></div><div data-composer-card><div data-composer-input contenteditable="true">整段文字汇聚成水滴，抵达后保持排版完整展开。</div><footer><button>＋</button><button id="send">↑</button></footer></div><p>点击发送或按 Enter；Shift+Enter 换行。原型仅在本地显示消息。<a href="?mode=off">仅水纹</a> · <a href="?mode=liquid">水纹与水滴</a></p><script>
const mode=new URLSearchParams(location.search).get('mode')==='off'?'off':'liquid';
localStorage.setItem('ratel-lumina/settings/v1',JSON.stringify({version:1,effects:{brand:false,composerGlow:false,composerRibbon:false,caret:false,press:true,typeWave:false,hero:false,panelMotion:false,groupMotion:false,sessionActivity:false,sendTransition:mode}}));
window.face=value=>{const ls=new Set();return{getSnapshot:()=>value,subscribe:fn=>{ls.add(fn);return()=>ls.delete(fn)},set:next=>{value=next;ls.forEach(fn=>fn())}}};
window.current=face({key:'one'});window.session=face({pendingSubmissions:[]});window.chat=face({order:[],nodes:new Map()});window.cleanups=[];window.__ModuleLoader__={load:r=>window.registration=r};
let serial=0;
const submit=()=>{const input=document.querySelector('[contenteditable]'),text=input.innerText;if(!text.trim())return;const requestId='request-'+(++serial),nodeId='node-'+serial;session.set({pendingSubmissions:[{requestId,placement:'transcript',text,time:Date.now()}]});input.textContent='';const row=document.createElement('div');row.className='row';row.dataset.chatNodeKey=nodeId;const bubble=document.createElement('div');bubble.className='bubble';const span=document.createElement('span');span.textContent=text;bubble.append(span);row.append(bubble);document.querySelector('#chat').replaceChildren(row);chat.set({order:[nodeId],nodes:new Map([[nodeId,{data:{source:{kind:'user',rpcId:requestId}}}]])})};
document.querySelector('#send').onclick=submit;document.querySelector('[contenteditable]').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit()}};
</script><script src="/__lumina/react.js"></script><script src="/__lumina/client.js"></script><script>
const plugin=registration.factory(s=>s==='react'?React:{jsx:(t,p)=>React.createElement(t,p),jsxs:(t,p)=>React.createElement(t,p),Fragment:React.Fragment});
plugin.apply({sessions:{binding:()=>({session})},uiSession:{current},uiConversation:{binding:()=>({target:()=>chat})},slots:{register:()=>()=>{},inject:()=>()=>{}},locale:{register:()=>()=>{},bind:()=>k=>k},effect:fn=>cleanups.push(fn())});
addEventListener('pagehide',()=>cleanups.forEach(fn=>fn?.()));
</script></html>
