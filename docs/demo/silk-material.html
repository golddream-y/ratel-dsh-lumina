<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="icon" href="data:,"><title>Lumina · WebGPU 材质样板</title>
<style>body{margin:0;padding:32px;background:#f4f5f7;color:#232936;font:15px system-ui}main{max-width:1280px;margin:auto}h1{font-size:24px}p{color:#737985}section{background:white;border-radius:20px;overflow:hidden;margin:20px 0}canvas{width:100%;display:block}img{width:100%;display:block}header{padding:20px;display:flex;align-items:center;gap:16px}button{border:0;background:#e9eefc;color:#2d4d95;padding:10px 20px;border-radius:10px;cursor:pointer}input{width:220px}small{margin-left:auto;color:#79818e}</style>
<main><h1>光带材质 · WebGPU</h1><p>先检查曲面与反光。默认定格；当前位置与延伸比例尚未调整。</p><section><header><button id="play">播放</button><label>时间 <input id="time" type="range" min="0" max="25" step="0.01" value="0"></label><small id="status">初始化中</small></header><canvas></canvas></section><p>SVG 细化稿：WebGPU 保留这张稿的褶皱、高光和光晕，以同一网格做轻微形变。</p><section><img src="/__lumina/silk-study.svg"></section><p>README 参考：对比宽面、薄边、透色与局部白色高光。</p><section><img src="/__lumina/reference.webp"></section></main>
<script type="module">
import {createRibbonRenderer} from '/__lumina/ribbon-renderer.js';
const canvas=document.querySelector('canvas'),status=document.querySelector('#status'),slider=document.querySelector('#time'),button=document.querySelector('#play');let renderer,playing=false,t=0,last=0,raf=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function draw(){if(!renderer)return;const width=canvas.clientWidth,height=320;const dpr=Math.min(devicePixelRatio,1.25,Math.sqrt(1500000/(width*height)));canvas.style.height=height+'px';const w=Math.round(width*dpr),h=Math.round(height*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}renderer.render(width,height,{x:width*.24,y:60,width:width*.58,height:70},t,false)}
function frame(now){if(!playing||reduced.matches)return;if(last)t+=Math.min(60,now-last)/1000;last=now;slider.value=t%25;draw();raf=requestAnimationFrame(frame)}
button.onclick=()=>{playing=!playing&&!reduced.matches;button.textContent=playing?'暂停':'播放';last=0;cancelAnimationFrame(raf);if(playing)raf=requestAnimationFrame(frame)};slider.oninput=()=>{t=Number(slider.value);draw()};new ResizeObserver(draw).observe(canvas);
reduced.onchange=()=>{playing=false;cancelAnimationFrame(raf);button.textContent='播放';draw()};
renderer=await createRibbonRenderer(canvas,()=>{playing=false;cancelAnimationFrame(raf);status.textContent='设备不可用'});status.textContent=renderer?'SVG 细化稿 · WebGPU 形变':'当前环境无法使用 WebGPU';draw();window.material={get renderer(){return renderer},draw,setTime(value){t=value;draw()}};addEventListener('pagehide',()=>{cancelAnimationFrame(raf);renderer?.dispose()});
</script></html>
