<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ratel Lumina · Type wave</title>
<style>
  :root { --brand:#FF3B30; --blue:#4176e6; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; padding:48px 0;
    background: radial-gradient(1200px 620px at 50% -10%, #fff 0%, #eef3fb 55%, #e5ecf8 100%);
    color:#182230; font:14px/1.6 ui-sans-serif,-apple-system,"SF Pro Text","PingFang SC",sans-serif;
  }
  .wrap { width:min(760px, calc(100vw - 40px)); margin:0 auto; }
  h1 { margin:0 0 6px; font-size:22px; letter-spacing:-.02em; }
  .lead { margin:0 0 24px; color:#5b6676; }
  .card { background:rgba(255,255,255,.85); border:1px solid #dfe6f2; border-radius:20px; padding:20px; box-shadow:0 18px 50px rgba(31,57,104,.08); margin-bottom:18px; }
  .card h2 { margin:0 0 4px; font-size:16px; }
  .card p { margin:0 0 14px; color:#6b7688; font-size:12px; }
  .field { position:relative; }
  .field textarea {
    width:100%; min-height:90px; resize:vertical; border:1px solid #dfe6f2; border-radius:16px;
    padding:14px 16px; font:inherit; font-size:16px; line-height:1.7; outline:0; background:#fff; color:#182230;
  }
  .stream { position:relative; min-height:86px; padding:14px 16px; border:1px solid #dfe6f2; border-radius:16px; background:#fff; font-size:16px; line-height:1.8; }
  .spark { position:absolute; border-radius:50%; pointer-events:none; mix-blend-mode:screen; background:radial-gradient(circle, rgba(255,59,48,.55), rgba(255,59,48,0) 70%); animation:spark .62s ease-out forwards; }
  .spark.blue { background:radial-gradient(circle, rgba(65,118,230,.55), rgba(65,118,230,0) 70%); }
  @keyframes spark { from { opacity:.9; transform:scale(.25);} to { opacity:0; transform:scale(1.6);} }
  .hint { color:#6b7688; font-size:12px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>逐字波浪</h1>
    <p class="lead">新出现的字依次被点亮。文字本身不动，光是叠在字上面的一层。</p>

    <section class="card">
      <h2>输入框</h2>
      <p>在这里打字，每输入一个字，字上就冒出一小片光。</p>
      <div class="field" id="fieldInput">
        <textarea id="input" placeholder="打字试试…"></textarea>
      </div>
    </section>

    <section class="card">
      <h2>流式输出</h2>
      <p>模型文字流式到达时同样逐字点亮。</p>
      <div class="field" id="fieldStream">
        <div class="stream" id="stream"></div>
      </div>
      <p class="hint"><button id="play" type="button">重播一次</button></p>
    </section>
  </div>
<script>
  const input = document.getElementById('input');
  const fieldInput = document.getElementById('fieldInput');
  const stream = document.getElementById('stream');
  const fieldStream = document.getElementById('fieldStream');
  const TEXT = '光沿着刚出现的字一个一个传过去';

  function sparkAt(field, element, index, total, blue) {
    const node = document.createElement('span');
    node.className = blue ? 'spark blue' : 'spark';
    const rect = element.getBoundingClientRect();
    const box = field.getBoundingClientRect();
    const size = Math.max(rect.height, 18) * 1.9;
    node.style.width = `${size}px`;
    node.style.height = `${size}px`;
    node.style.left = `${rect.left - box.left + rect.width / 2 - size / 2}px`;
    node.style.top = `${rect.top - box.top + rect.height / 2 - size / 2}px`;
    node.style.animationDelay = `${index * 55}ms`;
    field.append(node);
    setTimeout(() => node.remove(), 700 + index * 55);
  }

  function lightLast(field, element, count, blue) {
    const text = element.value ?? element.textContent ?? '';
    const chars = [...text];
    const from = Math.max(0, chars.length - count);
    const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
    const nodes = [];
    let node;
    while ((node = walker.nextNode())) nodes.push(node);
    let seen = 0;
    for (const textNode of nodes) {
      const value = textNode.textContent ?? '';
      for (let i = 0; i < value.length; i += 1) {
        if (seen >= from && seen < chars.length) {
          const range = document.createRange();
          range.setStart(textNode, i);
          range.setEnd(textNode, i + 1);
          const rect = range.getBoundingClientRect();
          if (rect.width > 0) sparkAt(field, { getBoundingClientRect: () => rect }, seen - from, count, blue);
        }
        seen += 1;
      }
    }
  }

  input.addEventListener('input', () => {
    const count = [...(input.value ?? '')].length;
    if (!count) return;
    lightLast(fieldInput, input, 6, false);
  });

  async function playStream() {
    stream.textContent = '';
    for (let i = 1; i <= TEXT.length; i += 1) {
      stream.textContent = TEXT.slice(0, i);
      lightLast(fieldStream, stream, 1, true);
      await new Promise((resolve) => setTimeout(resolve, 70));
    }
  }
  document.getElementById('play').addEventListener('click', playStream);
  playStream();
</script>
</body>
</html>
