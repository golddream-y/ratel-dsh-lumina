<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ratel Lumina · Type wave</title>
<style>
  :root { --brand:#FF3B30; --blue:#4176e6; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; padding:48px 0;
    background: radial-gradient(1200px 620px at 50% -10%, #fff 0%, #eef3fb 55%, #e5ecf8 100%);
    color:#182230; font:14px/1.6 ui-sans-serif,-apple-system,"SF Pro Text","PingFang SC",sans-serif;
  }
  .wrap { width:min(760px, calc(100vw - 40px)); margin:0 auto; }
  h1 { margin:0 0 6px; font-size:22px; letter-spacing:-.02em; }
  .lead { margin:0 0 24px; color:#5b6676; }
  .card { background:rgba(255,255,255,.85); border:1px solid #dfe6f2; border-radius:20px; padding:20px; box-shadow:0 18px 50px rgba(31,57,104,.08); margin-bottom:18px; }
  .card h2 { margin:0 0 4px; font-size:16px; }
  .card p { margin:0 0 14px; color:#6b7688; font-size:12px; }
  .field { position:relative; }
  .field .input {
    position:relative; z-index:1;
    width:100%; min-height:90px; border:1px solid #dfe6f2; border-radius:16px;
    padding:14px 16px; font:inherit; font-size:16px; line-height:1.7; outline:0; background:#fff; color:#182230;
    white-space:pre-wrap; overflow-wrap:anywhere;
  }
  .field .input:empty::before { content:attr(data-placeholder); color:#9aa6b8; }
  .stream { position:relative; z-index:1; min-height:86px; padding:14px 16px; border:1px solid #dfe6f2; border-radius:16px; background:#fff; font-size:16px; line-height:1.8; }
  /* The light is a blurred copy of the glyph itself, drawn above the text:
     the character looks lit from within, while the real text stays crisp. */
  .spark { position:absolute; z-index:2; pointer-events:none; white-space:pre;
    filter:blur(3px);
    animation:spark .55s ease-out forwards; }
  .spark.red { color:rgba(255,59,48,.95); }
  .spark.blue { color:rgba(65,118,230,.95); }
  @keyframes spark { from { opacity:1; } to { opacity:0; } }
  .hint { color:#6b7688; font-size:12px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>逐字波浪</h1>
    <p class="lead">新出现的字依次被点亮。文字本身不动，光是叠在字上面的一层。</p>

    <section class="card">
      <h2>输入框</h2>
      <p>在这里打字，每输入一个字，字上就冒出一小片光。</p>
      <div class="field" id="fieldInput">
        <div class="input" id="input" contenteditable="true" data-placeholder="打字试试…"></div>
      </div>
    </section>

    <section class="card">
      <h2>流式输出</h2>
      <p>模型文字流式到达时同样逐字点亮。</p>
      <div class="field" id="fieldStream">
        <div class="stream" id="stream"></div>
      </div>
      <p class="hint"><button id="play" type="button">重播一次</button></p>
    </section>
  </div>
<script>
  const input = document.getElementById('input');
  const fieldInput = document.getElementById('fieldInput');
  const stream = document.getElementById('stream');
  const fieldStream = document.getElementById('fieldStream');
  const TEXT = '光沿着刚出现的字一个一个传过去';
  const MAX_LIGHTS = 10;

  function addLight(field, element, rect, char, index, blue) {
    const node = document.createElement('span');
    node.className = blue ? 'spark blue' : 'spark red';
    node.textContent = char;
    const box = field.getBoundingClientRect();
    const style = getComputedStyle(element);
    node.style.font = style.font;
    node.style.color = blue ? 'rgba(65,118,230,.95)' : 'rgba(255,59,48,.95)';
    node.style.left = `${rect.left - box.left}px`;
    node.style.top = `${rect.top - box.top}px`;
    node.style.width = `${rect.width}px`;
    node.style.height = `${rect.height}px`;
    node.style.lineHeight = `${rect.height}px`;
    node.style.animationDelay = `${index * 45}ms`;
    field.append(node);
    // Never let the lights pile up.
    while (field.querySelectorAll('.spark').length > MAX_LIGHTS) {
      field.querySelector('.spark').remove();
    }
    setTimeout(() => node.remove(), 560 + index * 45);
  }

  /** Light the characters in [from, to) of an element's visible text. */
  function lightRange(field, element, from, to, blue) {
    const text = element.innerText ?? element.textContent ?? '';
    const chars = [...text];
    const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
    const textNodes = [];
    let node;
    while ((node = walker.nextNode())) textNodes.push(node);
    let seen = 0;
    let lit = 0;
    for (const textNode of textNodes) {
      const value = textNode.textContent ?? '';
      for (let i = 0; i < value.length; i += 1) {
        if (seen >= from && seen < to) {
          const range = document.createRange();
          range.setStart(textNode, i);
          range.setEnd(textNode, i + 1);
          const rect = range.getBoundingClientRect();
          if (rect.width > 0) { addLight(field, element, rect, chars[seen] ?? '', lit, blue); lit += 1; }
        }
        seen += 1;
      }
    }
    return chars.length;
  }

  let typedCount = 0;
  input.addEventListener('input', () => {
    const count = [...(input.innerText ?? '')].length;
    if (count === typedCount) return;
    const from = Math.min(typedCount, count);
    typedCount = count;
    if (count > from) lightRange(fieldInput, input, from, count, false);
  });

  async function playStream() {
    stream.textContent = '';
    let seen = 0;
    for (let i = 1; i <= TEXT.length; i += 1) {
      stream.textContent = TEXT.slice(0, i);
      const count = [...(stream.innerText ?? '')].length;
      if (count > seen) lightRange(fieldStream, stream, seen, count, true);
      seen = count;
      await new Promise((resolve) => setTimeout(resolve, 70));
    }
  }
  document.getElementById('play').addEventListener('click', playStream);
  playStream();
</script>
